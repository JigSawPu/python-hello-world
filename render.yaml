services:
  - type: web
    runtime: static
    name: bitcoin-explorer-delivery-1
    repo: https://github.com/JigSawPu/python-hello-world
    branch: bitcoin-explorer/delivery-1
    buildCommand: npm install --no-audit --no-fund && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
